# TicketSurge — full stack.
#
#   docker compose up --build
#
# Defaults to Oracle as the primary DB per the project's DB strategy
# (see docs/adr/0003-database-strategy.md). If Oracle won't run on your
# machine (e.g. no ARM image for your Oracle version on Apple Silicon),
# switch DB_ENGINE to "postgres" below and start the `postgres` service
# instead of `oracle` — the application code is identical either way:
#
#   docker compose --profile postgres up --build
#
# (the `postgres` service only starts when that profile is active, and
# the .env file's DB_ENGINE/POSTGRES_* values take over automatically.)

services:
  oracle:
    image: gvenzl/oracle-free:slim-faststart
    profiles: ["oracle", "default"]
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:-ticketsurge_sys}
      APP_USER: ${ORACLE_APP_USER:-ticketsurge}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-ticketsurge}
    ports: ["1521:1521"]
    volumes: ["oracle-data:/opt/oracle/oradata"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticketsurge}
      POSTGRES_USER: ${POSTGRES_USER:-ticketsurge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ticketsurge}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ticketsurge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"  # management UI: http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_seats &&
             daphne -b 0.0.0.0 -p 8000 ticketsurge.asgi:application"
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: celery -A ticketsurge worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000
        VITE_WS_BASE: ws://localhost:8000
    ports: ["5173:80"]
    depends_on: [web]

volumes:
  oracle-data:
  postgres-data:
